# Cloudflare Pages Configuration
# This file configures your Cloudflare Pages project settings

name = "vite-react-shadcn-ts"
compatibility_date = "2024-01-01"

# Production branch configuration
[env.production]
name = "vite-react-shadcn-ts"
routes = [
  { pattern = "your-domain.com/*", zone_name = "your-domain.com" }
]

# Preview/Development branch configuration
[env.preview]
name = "vite-react-shadcn-ts-preview"

# Build configuration
[build]
command = "npm run build"
cwd = "."
watch_dir = "src"

# Directory containing the built application
[build.upload]
format = "modules"
dir = "dist"
rules = [
  { type = "ESModule", globs = ["**/*.js"] }
]

# Environment variables (secrets should be set via: wrangler secret put <KEY>)
[vars]
# Add your environment variables here
# VITE_API_URL = "https://api.example.com"
# VITE_APP_VERSION = "1.0.0"

# KV Namespaces (if needed)
# [[kv_namespaces]]
# binding = "MY_KV_NAMESPACE"
# id = "your-kv-namespace-id"
# preview_id = "your-preview-kv-namespace-id"

# D1 Databases (if needed)
# [[d1_databases]]
# binding = "DB"
# database_name = "my-database"
# database_id = "your-database-id"

# R2 Buckets (if needed)
# [[r2_buckets]]
# binding = "MY_BUCKET"
# bucket_name = "my-bucket"

# Compatibility flags
[compatibility_flags]
nodejs_compat = true

# Limits and quotas
[limits]
cpu_ms = 1000
